<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Tiên Nghịch Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 350px;
            padding: 16px;
            color: #cdd6f4;
            background: #11111b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .header img { width: 36px; height: 36px; border-radius: 8px; }
        .header-title { color: #f5c2e7; font-size: 14px; font-weight: bold; }
        .header-sub { margin-top: 2px; color: #a6e3a1; font-size: 11px; }
        .card {
            padding: 12px 14px;
            margin-bottom: 12px;
            background: #1e1e2e;
            border: 1px solid rgba(203,166,247,0.25);
            border-radius: 10px;
        }
        .card-title {
            margin-bottom: 8px;
            color: #a6adc8;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .feature-list { padding-left: 18px; color: #cdd6f4; line-height: 1.7; }
        .hint { margin-top: 8px; color: #a6adc8; font-size: 11px; line-height: 1.45; }
        .btn {
            display: block;
            width: 100%;
            padding: 10px 0;
            color: #11111b;
            background: #a6e3a1;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: bold;
            text-align: center;
        }
        .btn[hidden] { display: none; }
        .btn:hover { background: #94e2d5; }
        .footer {
            margin-top: 10px;
            padding-top: 8px;
            color: #6c7086;
            border-top: 1px solid rgba(255,255,255,0.06);
            font-size: 11px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="icon48.png" alt="">
        <div>
            <div class="header-title">⚡ Auto Tiên Nghịch Mobile</div>
            <div class="header-sub">Bảng tính năng</div>
        </div>
    </div>

    <section class="card" aria-labelledby="features-title">
        <div id="features-title" class="card-title">Các khu vực tính năng</div>
        <ul class="feature-list">
            <li>Đạo Thành</li>
            <li>Tu Sĩ</li>
            <li>Trợ Chiến</li>
            <li>Lịch Luyện</li>
            <li>Ma Đạo</li>
        </ul>
        <p class="hint">Mở game để xem và bật các chức năng tự động. Cấu hình được lưu trong trang game.</p>
    </section>

    <button id="btn-open-game" class="btn" type="button">🚀 Mở bảng tính năng trong game</button>
    <div id="popup-status" class="hint" role="status" aria-live="polite"></div>
    <div class="footer"></div>

    <script src="popup.js"></script>
</body>
</html>
